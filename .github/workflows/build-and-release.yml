name: Build and Release

# Manual trigger only - will NEVER run automatically on push, PR, or edits
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v5.5.0.1)'
        required: true
        type: string
        default: 'v1.0.6.2'
      create_release:
        description: 'Publish as official GitHub Release'
        required: false
        type: boolean
        default: true
      publish_pypi:
        description: 'Publish Python packages to PyPI (requires PYPI_API_TOKEN secret)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build Native Engine, Python SDK & Release Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packaging Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build wheel twine setuptools pillow

      - name: Verify Build Prerequisites (CMake & Ninja)
        run: |
          cmake --version
          ninja --version

      - name: Cache Upstream Sources (deps)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-sources-${{ runner.os }}-tess550-lep184

      - name: Fetch Upstream Dependencies (Tesseract & Leptonica)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call update_sources.cmd

      - name: Cache Compiled Native Engine (dist)
        id: cache-dist
        uses: actions/cache@v4
        with:
          path: dist
          key: dist-binaries-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'build.cmd') }}

      - name: Build Native Standalone Engine (/MT x64 and x86)
        if: steps.cache-dist.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call build.cmd all

      - name: Build and Validate Python Wheels (Twine)
        shell: cmd
        run: |
          call build_python.cmd

      - name: Test Native Loading in Python
        shell: cmd
        run: |
          python -c "import sys; sys.path.insert(0, 'python'); import accsify_tesseract; print('Engine Version:', accsify_tesseract.TesseractEngine.version()); print('Loaded DLL:', accsify_tesseract.get_native_dll_path()); print('Loaded CLI:', accsify_tesseract.get_native_cli_path())"

      - name: Package GitHub Release Bundles (ZIP and SHA256)
        shell: cmd
        run: |
          call package_release.cmd

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: accsify-tesseract-release-packages
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: Accsify Tesseract ${{ inputs.tag_name }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/*.zip
            release/*.whl
            release/*.tar.gz
            release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: inputs.publish_pypi
        shell: cmd
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload python/dist/*
